<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's For Dinner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="header-brand">
                <div class="brand-icon"><i class="fa-solid fa-utensils"></i></div>
                <div>
                    <h1>What's For Dinner</h1>
                    <p>Your daily meal inspiration</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" aria-label="Saved Recipes"><i class="fa-solid fa-bookmark"></i></button>
                <button class="icon-btn" aria-label="Recent"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <button class="icon-btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
                <div class="profile-avatar">👤</div>
            </div>
        </div>
    </header>

    <main class="recipe-card" id="recipeCard">

    </main>

    <script src="js/meals.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
